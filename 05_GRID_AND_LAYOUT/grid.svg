<title id="t">Grid system</title>
<desc id="d">Four columns on phones, eight on tablets, twelve on desktop. Media breaks the grid on purpose: full-bleed on mobile, edge-to-edge rails that peek past the margin. · Wake, A Glance-inspired design system. Original vector artwork; not a Glance asset.</desc>
