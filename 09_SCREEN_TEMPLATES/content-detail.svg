s" font-size="17" font-weight="400" fill="#B8B8C2">best.</text><text x="50" y="698.88" class="sans" font-size="20" font-weight="700" letter-spacing="-0.3" fill="#FFFFFF">Day one · before sunrise</text><text x="50" y="728.88" class="sans" font-size="15" font-weight="400" fill="#B8B8C2">Be at Assi ghat by 5:15. The boats leave when</text><text x="50" y="751.38" class="sans" font-size="15" font-weight="400" fill="#B8B8C2">there is just enough light to see the far bank.</text><rect x="30" y="764" width="390" height="110" fill="rgba(12,12,16,.96)"/><line x1="30" y1="764" x2="420" y2="764" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" stroke-linecap="butt"/><text x="50" y="804" class="sans tnum" font-size="17" font-weight="600" letter-spacing="-0.17" fill="#FFFFFF">Trips from ₹8,400</text><circle cx="53" cy="825" r="3" fill="#2FD08A"/><text x="62" y="829" class="sans" font-size="11" font-weight="600" fill="#2FD08A">Live · checked 9:41</text><g><rect x="246.72" y="786" width="153.28" height="44" rx="22.0" fill="#E6003F"/><text x="266.72" y="813.4" class="sans" font-size="15" font-weight="600" letter-spacing="-0.07" fill="#FFFFFF">Plan this trip</text><g transform="translate(362 799) scale(0.75)" fill="none" stroke="#FFFFFF" stroke-width="2.333" stroke-linecap="round" stroke-linejoin="round" data-icon="arrow"><path d="M7 17 17 7"/><path d="M8.5 7H17v8.5"/></g></g><rect x="158" y="861" width="134" height="5" rx="3" fill="#FFFFFF"/></g><rect x="163" y="41" width="124" height="36" rx="18" fill="#000000"/></g>
