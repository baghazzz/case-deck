<text x="64" y="920" class="sans" font-size="17" font-weight="600" letter-spacing="-0.17" fill="#FFFFFF">One primary per view.</text>
<text x="64" y="944" class="sans" font-size="13" font-weight="400" fill="#B8B8C2">If two actions compete, one becomes secondary or moves into a sheet.</text>
<text x="804" y="920" class="sans" font-size="17" font-weight="600" letter-spacing="-0.17" fill="#FFFFFF">Label = verb + object.</text>
<text x="804" y="944" class="sans" font-size="13" font-weight="400" fill="#B8B8C2">&quot;Plan a trip&quot;, &quot;Book at ₹5,842&quot;, &quot;Open official page&quot;. Never &quot;Submit&quot; or &quot;OK&quot;.</text>
<text x="64" y="990" class="sans" font-size="17" font-weight="600" letter-spacing="-0.17" fill="#FFFFFF">Prices in labels come from data.</text>
<text x="64" y="1014" class="sans" font-size="13" font-weight="400" fill="#B8B8C2">A button that carries a price is bound to the same quote ID as the card it sits on.</text>
<text x="804" y="990" class="sans" font-size="17" font-weight="600" letter-spacing="-0.17" fill="#FFFFFF">Min touch target 44 × 44.</text>
<text x="804" y="1014" class="sans" font-size="13" font-weight="400" fill="#B8B8C2">Size S (32px) is for dense desktop rows only, with 6px invisible padding.</text>
