<title id="t">Buttons</title>
<desc id="d">Pill-shaped, one primary per view. Primary is the signal red; secondary is the inverse of the theme; tertiary is an outline. On imagery, buttons turn to glass. · Wake, A Glance-inspired design system. Original vector artwork; not a Glance asset.</desc>
