<text x="64" y="540" class="sans" font-size="15" font-weight="400" fill="#B8B8C2">· Active: text-primary 15/700 + 16×3 signal bar, 9px below baseline.</text>
<text x="64" y="568" class="sans" font-size="15" font-weight="400" fill="#B8B8C2">· Inactive: text-tertiary 15/500. Gap 22px. Scrolls; first tab is always For you.</text>
<text x="64" y="596" class="sans" font-size="15" font-weight="400" fill="#B8B8C2">· Segmented: for 2–3 mutually exclusive views of the same content. Selected segment = theme inverse.</text>
<text x="64" y="624" class="sans" font-size="15" font-weight="400" fill="#B8B8C2">· Tabs change content in place (240ms cross-fade), never navigate away.</text>
