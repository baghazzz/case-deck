<text x="1096" y="656" class="sans" font-size="12" font-weight="500" fill="#85838F">scrim-full rgba(0,0,0,.48) behind every modal</text>
<text x="520" y="760" class="sans" font-size="15" font-weight="400" fill="#B8B8C2">· Sheet: radius 24 top, 36×5 grabber, max 90% height, drag to dismiss, 360ms enter / 240ms exit.</text>
<text x="520" y="790" class="sans" font-size="15" font-weight="400" fill="#B8B8C2">· Dialog: only for irreversible or money-changing moments. Title states the fact; primary restates the action with its value.</text>
<text x="520" y="820" class="sans" font-size="15" font-weight="400" fill="#B8B8C2">· Toast: 48px pill, bottom 96px above the nav, 4s, one action max. Warnings use the warning icon, never red.</text>
<text x="520" y="850" class="sans" font-size="15" font-weight="400" fill="#B8B8C2">· Tooltip: iris, explains personalisation or a data source. Arrow points at the thing it explains.</text>
