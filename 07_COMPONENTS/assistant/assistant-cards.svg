<g id="fare-card"><rect x="480" y="260" width="380" height="270" rx="16" fill="#16161B" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/><text x="496" y="290" class="sans" font-size="12" font-weight="600" fill="#85838F">Skyline Air · SK 2134</text><g><rect x="764.59" y="274" width="79.41" height="22" rx="11.0" fill="#33260A"/><g transform="translate(771.59 278.5) scale(0.5417)" fill="none" stroke="#FFB020" stroke-width="3.231" stroke-linecap="round" stroke-linejoin="round" data-icon="alert"><path d="M12 3.8 21 19.5H3z"/><path d="M12 10v4.5"/><circle cx="12" cy="17" r="1.6" fill="#FFB020"/></g><text x="787.59" y="288.8" class="sans" font-size="10.5" font-weight="600" letter-spacing="0.84" fill="#FFB020">CACHED</text></g><text x="496" y="334" class="sans tnum" font-size="26" font-weight="700" letter-spacing="-0.52" fill="#FFFFFF">06:10</text><text x="496" y="354" class="sans" font-size="12" font-weight="600" fill="#B8B8C2">DEL</text><text x="844" y="334" class="sans tnum" font-size="26" font-weight="700" letter-spacing="-0.52" text-anchor="end" fill="#FFFFFF">08:45</text><text x="844" y="354" class="sans" font-size="12" font-weight="600" text-anchor="end" fill="#B8B8C2">GOI</text><line x1="584" y1="326" x2="756" y2="326" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="3 4"/><rect x="656" y="314" width="28" height="24" fill="#16161B"/><g transform="translate(660 316) scale(0.8333)" fill="none" stroke="#B8B8C2" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" data-icon="plane"><path d="M12 2.8c.9 0 1.5.9 1.5 2v5.1l7 4.1v2l-7-2.1v4.1l2.2 1.6v1.6L12 20.3l-3.7.9v-1.6l2.2-1.6v-4.1l-7 2.1v-2l7-4.1V4.8c0-1.1.6-2 1.5-2z"/></g><text x="670" y="354" class="sans" font-size="11" font-weight="500" text-anchor="middle" fill="#85838F">2h 35m · Non-stop</text><line x1="496" y1="372" x2="844" y2="372" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" stroke-linecap="butt"/><text x="496" y="408" class="sans tnum" font-size="30" font-weight="700" letter-spacing="-0.6" fill="#FFFFFF">₹5,842</text><text x="496" y="430" class="sans" font-size="11" font-weight="500" fill="#85838F">Incl. taxes and fees · Economy saver</text><circle cx="644.75" cy="404" r="3" fill="#FFB020"/><text x="844" y="408" class="sans tnum" font-size="11" font-weight="600" text-anchor="end" fill="#FFB020">Cached 9:32 · couldn't reach airline</text><g><rect x="496" y="458" width="348" height="52" rx="26.0" fill="#E6003F"/><text x="612.49" y="489.4" class="sans" font-size="15" font-weight="600" letter-spacing="-0.07" fill="#FFFFFF">Check live price</text></g></g>
<text x="896" y="240" class="sans" font-size="11" font-weight="600" letter-spacing="0.88" fill="#85838F">FARE CARD · PRICE CHANGED</text>
<g id="fare-card"><rect x="896" y="260" width="380" height="270" rx="16" fill="#16161B" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/><text x="912" y="290" class="sans" font-size="12" font-weight="600" fill="#85838F">Skyline Air · SK 2134</text><g><rect x="1132.66" y="274" width="127.34" height="22" rx="11.0" fill="#33260A"/><g transform="translate(1139.66 278.5) scale(0.5417)" fill="none" stroke="#FFB020" stroke-width="3.231" stroke-linecap="round" stroke-linejoin="round" data-icon="alert"><path d="M12 3.8 21 19.5H3z"/><path d="M12 10v4.5"/><circle cx="12" cy="17" r="1.6" fill="#FFB020"/></g><text x="1155.66" y="288.8" class="sans" font-size="10.5" font-weight="600" letter-spacing="0.84" fill="#FFB020">PRICE CHANGED</text></g><text x="912" y="334" class="sans tnum" font-size="26" font-weight="700" letter-spacing="-0.52" fill="#FFFFFF">06:10</text><text x="912" y="354" class="sans" font-size="12" font-weight="600" fill="#B8B8C2">DEL</text><text x="1260" y="334" class="sans tnum" font-size="26" font-weight="700" letter-spacing="-0.52" text-anchor="end" fill="#FFFFFF">08:45</text><text x="1260" y="354" class="sans" font-size="12" font-weight="600" text-anchor="end" fill="#B8B8C2">GOI</text><line x1="1000" y1="326" x2="1172" y2="326" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="3 4"/><rect x="1072" y="314" width="28" height="24" fill="#16161B"/><g transform="translate(1076 316) scale(0.8333)" fill="none" stroke="#B8B8C2" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" data-icon="plane"><path d="M12 2.8c.9 0 1.5.9 1.5 2v5.1l7 4.1v2l-7-2.1v4.1l2.2 1.6v1.6L12 20.3l-3.7.9v-1.6l2.2-1.6v-4.1l-7 2.1v-2l7-4.1V4.8c0-1.1.6-2 1.5-2z"/></g><text x="1086" y="354" class="sans" font-size="11" font-weight="500" text-anchor="middle" fill="#85838F">2h 35m · Non-stop</text><line x1="912" y1="372" x2="1260" y2="372" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" stroke-linecap="butt"/><text x="912" y="408" class="sans tnum" font-size="30" font-weight="700" letter-spacing="-0.6" fill="#FFFFFF">₹5,842</text><text x="1022" y="408" class="sans tnum" font-size="12" font-weight="500" letter-spacing="0.12" fill="#FFB020">was ₹5,210</text><text x="912" y="430" class="sans" font-size="11" font-weight="500" fill="#85838F">Incl. taxes and fees · Economy saver</text><circle cx="1157.94" cy="404" r="3" fill="#FFB020"/><text x="1260" y="408" class="sans tnum" font-size="11" font-weight="600" text-anchor="end" fill="#FFB020">Re-checked 9:44</text><g><rect x="912" y="458" width="348" height="52" rx="26.0" fill="#E6003F"/><text x="1017.71" y="489.4" class="sans" font-size="15" font-weight="600" letter-spacing="-0.07" fill="#FFFFFF">Continue at ₹5,842</text></g></g>
<text x="64" y="580" class="sans" font-size="11" font-weight="600" letter-spacing="0.88" fill="#85838F">POLICY ANSWER · CITED</text>
<g id="policy-card"><rect x="64" y="600" width="380" height="250" rx="16" fill="#16161B" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/><g><rect x="80" y="616" width="120.77" height="22" rx="11.0" fill="#0F2E22"/><g transform="translate(87 620.5) scale(0.5417)" fill="none" stroke="#2FD08A" stroke-width="3.231" stroke-linecap="round" stroke-linejoin="round" data-icon="shield-check"><path d="M12 3 19.5 6v5.5c0 4.6-3.2 8.2-7.5 9.5-4.3-1.3-7.5-4.9-7.5-9.5V6z"/><path d="M8.8 12.2l2.3 2.3 4.3-4.6"/></g><text x="103" y="630.8" class="sans" font-size="10.5" font-weight="600" letter-spacing="0.84" fill="#2FD08A">CITED ANSWER</text></g><text x="80" y="666" class="sans" font-size="15" font-weight="400" fill="#FFFFFF">Indian passport holders can enter Thailand</text><text x="80" y="688.5" class="sans" font-size="15" font-weight="400" fill="#FFFFFF">visa-free for tourism for a limited stay. Check the</text><text x="80" y="711" class="sans" font-size="15" font-weight="400" fill="#FFFFFF">stay length and entry conditions on the official</text><text x="80" y="733.5" class="sans" font-size="15" font-weight="400" fill="#FFFFFF">page before you fly.</text><rect x="76" y="762" width="356" height="60" rx="12" fill="#2A2A33"/><rect x="76" y="762" width="3" height="60" rx="1.5" fill="#2FD08A"/><g transform="translate(90 780) scale(0.9167)" fill="none" stroke="#B8B8C2" stroke-width="1.909" stroke-linecap="round" stroke-linejoin="round" data-icon="passport"><path d="M7 3h10a1.5 1.5 0 0 1 1.5 1.5v15A1.5 1.5 0 0 1 17 21H7a1.5 1.5 0 0 1-1.5-1.5v-15A1.5 1.5 0 0 1 7 3z"/><path d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/><path d="M9.5 16.5h5"/></g><text x="122" y="788" class="sans" font-size="12" font-weight="600" fill="#FFFFFF">Royal Thai Embassy, New Delhi · Visa page</text><text x="122" y="806" class="sans tnum" font-size="12" font-weight="500" fill="#85838F">Last verified 29 Sep 2026</text><g transform="translate(402 781) scale(0.8333)" fill="none" stroke="#B8B8C2" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" data-icon="external"><path d="M13.5 4.5h6v6"/><path d="M19.5 4.5l-8 8"/><path d="M17.5 13.5v5a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1v-11a1 1 0 0 1 1-1h5"/></g></g>
<text x="480" y="580" class="sans" font-size="11" font-weight="600" letter-spacing="0.88" fill="#85838F">NO SOURCE → DEFLECT + HANDOFF</text>
<g id="deflect-card"><rect x="480" y="600" width="380" height="246" rx="16" fill="#16161B" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/><g transform="translate(496 618) scale(0.8333)" fill="none" stroke="#5AA9FF" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" data-icon="info"><path d="M20.5 12a8.5 8.5 0 1 1-17 0 8.5 8.5 0 0 1 17 0z"/><path d="M12 11v5.5"/><circle cx="12" cy="7.9" r="1.6" fill="#5AA9FF"/></g><text x="526" y="633" class="sans" font-size="17" font-weight="600" letter-spacing="-0.17" fill="#FFFFFF">I can't confirm this one from an official</text><text x="526" y="655" class="sans" font-size="17" font-weight="600" letter-spacing="-0.17" fill="#FFFFFF">source</text><text x="496" y="690" class="sans" font-size="13" font-weight="400" fill="#B8B8C2">Transit rules for this route changed recently. Rather than</text><text x="496" y="709" class="sans" font-size="13" font-weight="400" fill="#B8B8C2">guess, here's the official page, or talk to a travel expert.</text><g><rect x="496" y="736" width="348" height="44" rx="22.0" fill="#FFFFFF"/><text x="592.5" y="763.4" class="sans" font-size="15" font-weight="600" letter-spacing="-0.07" fill="#0C0C10">Open official page</text><g transform="translate(729.5 749) scale(0.75)" fill="none" stroke="#0C0C10" stroke-width="2.333" stroke-linecap="round" stroke-linejoin="round" data-icon="external"><path d="M13.5 4.5h6v6"/><path d="M19.5 4.5l-8 8"/><path d="M17.5 13.5v5a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1v-11a1 1 0 0 1 1-1h5"/></g></g><g><rect x="496" y="788" width="348" height="44" rx="22.0" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/><g transform="translate(597.53 801) scale(0.75)" fill="none" stroke="#FFFFFF" stroke-width="2.333" stroke-linecap="round" stroke-linejoin="round" data-icon="chat"><path d="M4.5 6.5a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-6.5l-4.5 3.5v-3.5h0a2 2 0 0 1-2-2z"/></g><text x="623.53" y="815.4" class="sans" font-size="15" font-weight="600" letter-spacing="-0.07" fill="#FFFFFF">Talk to an expert</text></g></g>
<text x="896" y="580" class="sans" font-size="11" font-weight="600" letter-spacing="0.88" fill="#85838F">CONVERSATION</text>
<g id="bubble-user"><rect x="1045.21" y="600" width="230.79" height="65" rx="20" fill="#FFFFFF"/><text x="1061.21" y="627" class="sans" font-size="15" font-weight="400" fill="#0C0C10">Cheapest flight Delhi to Goa</text><text x="1061.21" y="649.5" class="sans" font-size="15" font-weight="400" fill="#0C0C10">this Friday?</text></g>
<g id="assistant-line"><circle cx="908" cy="693" r="12" fill="#251A2E"/><g transform="translate(900 685) scale(0.6667)" fill="none" stroke="#DDBEF0" stroke-width="2.625" stroke-linecap="round" stroke-linejoin="round" data-icon="personalization"><path d="M11 3.5c.6 4.3 2.2 5.9 6.5 6.5-4.3.6-5.9 2.2-6.5 6.5-.6-4.3-2.2-5.9-6.5-6.5 4.3-.6 5.9-2.2 6.5-6.5z"/><path d="M18.5 15.5c.2 1.3.7 1.8 2 2-1.3.2-1.8.7-2 2-.2-1.3-.7-1.8-2-2 1.3-.2 1.8-.7 2-2z"/></g><text x="930" y="698" class="sans" font-size="15" font-weight="400" fill="#FFFFFF">Checking live fares across 6 airlines…</text></g>
<g id="skeleton"><rect x="930" y="725" width="300" height="60" rx="16" fill="#2A2A33"/><rect x="930" y="801" width="90" height="10" rx="5" fill="#2A2A33"/><rect x="930" y="821" width="270" height="14" rx="7" fill="#2A2A33"/><rect x="930" y="843" width="195" height="14" rx="7" fill="#2A2A33"/><rect x="930" y="867" width="120" height="10" rx="5" fill="#2A2A33"/></g>
<text x="1330" y="240" class="sans" font-size="11" font-weight="600" letter-spacing="0.88" fill="#85838F">RULES</text>
<text x="1330" y="262" class="sans" font-size="13" font-weight="400" fill="#B8B8C2">The number on a fare card is</text><text x="1330" y="280.85" class="sans" font-size="13" font-weight="400" fill="#B8B8C2">rendered from the fare API</text><text x="1330" y="299.7" class="sans" font-size="13" font-weight="400" fill="#B8B8C2">response and bound to its offer ID.</text><text x="1330" y="318.55" class="sans" font-size="13" font-weight="400" fill="#B8B8C2">The model never types a price.</text>
<text x="1330" y="351.4" class="sans" font-size="13" font-weight="400" fill="#B8B8C2">Every fare shows its freshness:</text><text x="1330" y="370.25" class="sans" font-size="13" font-weight="400" fill="#B8B8C2">'Live · checked 9:41' (green) or</text><text x="1330" y="389.1" class="sans" font-size="13" font-weight="400" fill="#B8B8C2">'Cached 9:32' (amber).</text>
<text x="1330" y="421.95" class="sans" font-size="13" font-weight="400" fill="#B8B8C2">Policy answers carry a source row:</text><text x="1330" y="440.8" class="sans" font-size="13" font-weight="400" fill="#B8B8C2">publisher, page, last-verified date,</text><text x="1330" y="459.65" class="sans" font-size="13" font-weight="400" fill="#B8B8C2">external link.</text>
<text x="1330" y="492.5" class="sans" font-size="13" font-weight="400" fill="#B8B8C2">No retrieved source = no answer.</text><text x="1330" y="511.35" class="sans" font-size="13" font-weight="400" fill="#B8B8C2">Deflect to the official page and</text><text x="1330" y="530.2" class="sans" font-size="13" font-weight="400" fill="#B8B8C2">offer a human.</text>
<text x="1330" y="563.05" class="sans" font-size="13" font-weight="400" fill="#B8B8C2">Changed price = dialog with the</text><text x="1330" y="581.9" class="sans" font-size="13" font-weight="400" fill="#B8B8C2">new value in the primary label;</text><text x="1330" y="600.75" class="sans" font-size="13" font-weight="400" fill="#B8B8C2">nothing is charged silently.</text>
</svg>