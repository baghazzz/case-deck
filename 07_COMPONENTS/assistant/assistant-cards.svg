<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260" viewBox="0 0 1600 1260" role="img" aria-labelledby="t d">
<title id="t">Assistant cards</title>
<desc id="d">How the system extends to an AI travel assistant. Facts that change by the second are rendered as cards from their source; rules are quoted with the source attached; when neither is possible the assistant says so and hands off. · Wake, A Glance-inspired design system. Original vector artwork; not a Glance asset.</desc>
<defs><style>.sans{font-family:Inter, 'Helvetica Neue', Arial, sans-serif;}.disp{font-family:'Instrument Serif', 'Times New Roman', Georgia, serif;}.tnum{font-variant-numeric:tabular-nums;}</style></defs>
<rect id="background" width="1600" height="1260" fill="#0C0C10"/>
<text x="64" y="84" class="sans" font-size="12" font-weight="600" letter-spacing="0.96" fill="#FF0049">COMPONENTS · 07 · EXTENSION</text>
<text x="64" y="148" class="disp" font-size="64" font-weight="400" letter-spacing="-0.32" fill="#FFFFFF">Assistant answer cards</text>
<text x="1016" y="76" class="sans" font-size="15" font-weight="400" fill="#B8B8C2">How the system extends to an AI travel assistant. Facts that change by</text><text x="1016" y="98.5" class="sans" font-size="15" font-weight="400" fill="#B8B8C2">the second are rendered as cards from their source; rules are quoted</text><text x="1016" y="121" class="sans" font-size="15" font-weight="400" fill="#B8B8C2">with the source attached; when neither is possible the assistant says so</text><text x="1016" y="143.5" class="sans" font-size="15" font-weight="400" fill="#B8B8C2">and hands off.</text>
