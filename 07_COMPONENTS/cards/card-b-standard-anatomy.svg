<text x="1160" y="545.3" class="sans" font-size="13" font-weight="400" fill="#B8B8C2">Source · read time</text>
<text x="1160" y="576.85" class="sans" font-size="10" font-weight="600" letter-spacing="0.8" fill="#85838F">ACTIONS</text>
<text x="1160" y="594.85" class="sans" font-size="13" font-weight="400" fill="#B8B8C2">Whole card is the tap target; long-press opens the tune</text><text x="1160" y="612.4" class="sans" font-size="13" font-weight="400" fill="#B8B8C2">sheet</text>
<text x="1160" y="643.95" class="sans" font-size="10" font-weight="600" letter-spacing="0.8" fill="#85838F">STATES</text>
<text x="1160" y="661.95" class="sans" font-size="13" font-weight="400" fill="#B8B8C2">default · pressed · visited (title to text-secondary) · loading</text>
<text x="1160" y="693.5" class="sans" font-size="10" font-weight="600" letter-spacing="0.8" fill="#85838F">RESPONSIVE</text>
<text x="1160" y="711.5" class="sans" font-size="13" font-weight="400" fill="#B8B8C2">2 per row mobile grid; 3–4 per rail on tablet; 4–5 on desktop.</text>
