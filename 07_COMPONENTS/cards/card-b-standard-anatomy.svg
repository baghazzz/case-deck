<text x="1160" y="262" class="sans" font-size="10" font-weight="600" letter-spacing="0.8" fill="#85838F">DIMENSIONS</text>
<text x="1160" y="280" class="sans" font-size="13" font-weight="400" fill="#B8B8C2">240 wide in rails; 171 in two-up grids; media 3:2</text>
<text x="1160" y="311.55" class="sans" font-size="10" font-weight="600" letter-spacing="0.8" fill="#85838F">RADIUS</text>
<text x="1160" y="329.55" class="sans" font-size="13" font-weight="400" fill="#B8B8C2">16 on media only</text>
<text x="1160" y="361.1" class="sans" font-size="10" font-weight="600" letter-spacing="0.8" fill="#85838F">PADDING</text>
<text x="1160" y="379.1" class="sans" font-size="13" font-weight="400" fill="#B8B8C2">0 (text sits on the ground, not in a box)</text>
<text x="1160" y="410.65" class="sans" font-size="10" font-weight="600" letter-spacing="0.8" fill="#85838F">IMAGE RATIO</text>
<text x="1160" y="428.65" class="sans" font-size="13" font-weight="400" fill="#B8B8C2">3:2 (travel, editorial) or 4:5 (looks)</text>
<text x="1160" y="460.2" class="sans" font-size="10" font-weight="600" letter-spacing="0.8" fill="#85838F">TYPE</text>
<text x="1160" y="478.2" class="sans" font-size="13" font-weight="400" fill="#B8B8C2">kicker 11/600 caps tertiary · h3 17/600 (2 lines) · metadata</text><text x="1160" y="495.75" class="sans" font-size="13" font-weight="400" fill="#B8B8C2">12/500</text>
