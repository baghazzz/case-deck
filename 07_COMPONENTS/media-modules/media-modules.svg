<text x="560" y="860" class="sans" font-size="15" font-weight="400" fill="#B8B8C2">· Video: 16:9 in feed, 9:16 full-screen. Play glyph in a 56px glass circle; progress 3px, signal fill.</text>
<text x="560" y="890" class="sans" font-size="15" font-weight="400" fill="#B8B8C2">· Stories: 5s per frame, hold to pause, tap edges to step, swipe down to close. Text sits on scrim-bottom.</text>
