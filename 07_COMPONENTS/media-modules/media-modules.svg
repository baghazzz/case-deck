<title id="t">Media modules</title>
<desc id="d">Media is structure, not decoration. Video, galleries, stories and shoppable looks each have one control model, and all of them keep text off the image unless a scrim is underneath. · Wake, A Glance-inspired design system. Original vector artwork; not a Glance asset.</desc>
