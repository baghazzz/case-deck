<title id="t">Typography samples</title>
<desc id="d">The hook is set in the serif only when the moment is editorial. On media, Inter Bold at 26px is the workhorse; metadata always uses middle dots and tabular numerals. · Wake, A Glance-inspired design system. Original vector artwork; not a Glance asset.</desc>
<defs><style>.sans{font-family:Inter, 'Helvetica Neue', Arial, sans-serif;}.disp{font-family:'Instrument Serif', 'Times New Roman', Georgia, serif;}.tnum{font-variant-numeric:tabular-nums;}</style><clipPath id="c1"><rect x="64" y="240" width="358" height="448" rx="24"/></clipPath><linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9FD8F0"/><stop offset="0.5" stop-color="#57B8D6"/><stop offset="0.52" stop-color="#1E8FA8"/><stop offset="1" stop-color="#0B4F66"/></linearGradient><linearGradient id="g3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="0.35" stop-color="#000" stop-opacity="0.0"/><stop offset="0.6" stop-color="#000" stop-opacity="0.35"/><stop offset="1" stop-color="#000" stop-opacity="0.85"/></linearGradient><clipPath id="c4"><rect x="470" y="240" width="358" height="238.67" rx="16"/></clipPath><linearGradient id="g5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBD3A0"/><stop offset="1" stop-color="#E9876B"/></linearGradient></defs>
