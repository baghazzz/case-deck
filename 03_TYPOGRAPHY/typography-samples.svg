<text x="1016" y="76" class="sans" font-size="15" font-weight="400" fill="#B8B8C2">The hook is set in the serif only when the moment is editorial. On media,</text><text x="1016" y="98.5" class="sans" font-size="15" font-weight="400" fill="#B8B8C2">Inter Bold at 26px is the workhorse; metadata always uses middle dots</text><text x="1016" y="121" class="sans" font-size="15" font-weight="400" fill="#B8B8C2">and tabular numerals.</text>
