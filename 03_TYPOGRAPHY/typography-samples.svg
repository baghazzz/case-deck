" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.35"/><line x1="243" y1="560.32" x2="325.34" y2="560.32" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.35"/></g><rect x="64" y="240" width="358" height="448" rx="24" fill="url(#g3)"/><rect x="64" y="240" width="358" height="448" rx="24" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="1"/><g><rect x="80" y="256" width="82.65" height="24" rx="12.0" fill="rgba(37,26,46,.82)"/><g transform="translate(87 261.5) scale(0.5417)" fill="none" stroke="#DDBEF0" stroke-width="3.231" stroke-linecap="round" stroke-linejoin="round" data-icon="personalization"><path d="M11 3.5c.6 4.3 2.2 5.9 6.5 6.5-4.3.6-5.9 2.2-6.5 6.5-.6-4.3-2.2-5.9-6.5-6.5 4.3-.6 5.9-2.2 6.5-6.5z"/><path d="M18.5 15.5c.2 1.3.7 1.8 2 2-1.3.2-1.8.7-2 2-.2-1.3-.7-1.8-2-2 1.3-.2 1.8-.7 2-2z"/></g><text x="103" y="271.8" class="sans" font-size="10.5" font-weight="600" letter-spacing="0.84" fill="#DDBEF0">FOR YOU</text></g><g><circle cx="386" cy="272" r="20" fill="rgba(22,22,27,.56)"/><g transform="translate(376 262) scale(0.8333)" fill="none" stroke="#FFFFFF" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" data-icon="bookmark"><path d="M7 3.5h10a1.5 1.5 0 0 1 1.5 1.5v15.5L12 16l-6.5 4.5V5A1.5 1.5 0 0 1 7 3.5z"/></g></g><g><rect x="84" y="624" width="135.45" height="44" rx="22.0" fill="#E6003F"/><text x="104" y="651.4" class="sans" font-size="15" font-weight="600" letter-spacing="-0.07" fill="#FFFFFF">Plan a trip</text><g transform="translate(181.45 637) scale(0.75)" fill="none" stroke="#FFFFFF" stroke-width="2.333" stroke-linecap="round" stroke-linejoin="round" data-icon="arrow"><path d="M7 17 17 7"/><path d="M8.5 7H17v8.5"/></g></g><g><circle cx="380" cy="646" r="22" fill="rgba(22,22,27,.56)"/><g transform="translate(370 636) scale(0.8333)" fill="none" stroke="#FFFFFF" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" data-icon="share"><path d="M12 15V3.8"/><path d="M7.5 8.3 12 3.8l4.5 4.5"/><path d="M5 12.5V19a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 19 19v-6.5"/></g></g><text x="84" y="606" class="sans tnum" font-size="12" font-weight="500" letter-spacing="0.12" fill="rgba(255,255,255,.72)">Wake Travel · 4 min</text><text x="84" y="550.1" class="sans" font-size="26" font-weight="700" letter-spacing="-0.52" fill="#FFFFFF">Monsoon's over. Six</text><text x="84" y="580" class="sans" font-size="26" font-weight="700" letter-spacing="-0.52" fill="#FFFFFF">beaches worth the flight</text><text x="84" y="520.1" class="sans" font-size="11" font-weight="600" letter-spacing="0.88" fill="rgba(255,255,255,.8)">TRAVEL · FOR YOU</text></g>
<g id="card-editorial"><g clip-path="url(#c4)" data-media="temple"><rect x="470" y="240" width="358" height="238.67" fill="url(#g5)"/><path d="M541.6 442.8666666666667 V371.26666666666665 H756.4 V442.8666666666667Z" fill="#7A2E3A"/><path d="M606.04 371.26666666666665 Q649.0 287.73333333333335 691.96 371.26666666666665Z" fill="#7A2E3A"/><path d="M541.6 371.26666666666665 Q570.24 335.4666666666667 595.3 371.26666666666665Z" fill="#8F3A45"/><path d="M702.7 371.26666666666665 Q727.76 335.4666666666667 756.4 371.26666666666665Z" fill="#8F3A45"/><rect x="631.1" y="397.52" width="35.8" height="45.35" rx="17.900000000000002" fill="#3A1219"/><rect x="470" y="442.87" width="358" height="35.8" fill="#C9765A"/></g><rect x="470" y="240" width="358" height="238.67" rx="16" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="1"/><text x="470" y="504.67" class="sans" font-size="11" font-weight="600" letter-spacing="0.88" fill="#FF4D7D">THE LONG READ</text><text x="470" y="538.67" class="disp" font-size="30" font-weight="400" letter-spacing="-0.15" fill="#FFFFFF">Forty-eight hours in a city that</text><text x="470" y="571.07" class="disp" font-size="30" font-weight="400" letter-spacing="-0.15" fill="#FFFFFF">wakes before you do</text><text x="470" y="607.47" class="sans" font-size="13" font-weight="400" fill="#B8B8C2">A slow itinerary for Varanasi: dawn on the ghats, lunch in</text><text x="470" y="626.32" class="sans" font-size="13" font-weight="400" fill="#B8B8C2">the lanes, and the ceremony worth staying up for.</text><text x="470" y="655.17" class="sans tnum" font-size="12" font-weight="500" letter-spacing="0.12" fill="#85838F">Words by Meera Rao · 9 min read</text></g>
<text x="880" y="262" class="sans" font-size="11" font-weight="600" letter-spacing="0.88" fill="#FF4D7D">VISA &amp; ENTRY · CITED</text>
<text x="880" y="310" class="disp" font-size="44" font-weight="400" letter-spacing="-0.22" fill="#FFFFFF">What changes for Indian travellers this</text><text x="880" y="356.2" class="disp" font-size="44" font-weight="400" letter-spacing="-0.22" fill="#FFFFFF">winter</text>
<text x="880" y="408.4" class="sans tnum" font-size="12" font-weight="500" letter-spacing="0.12" fill="#85838F">Wake Travel desk · Last verified 29 Sep 2026 · 5 min</text>
<text x="880" y="452.4" class="sans" font-size="17" font-weight="400" fill="#B8B8C2">Every entry rule in this piece links to the official page it came from. Where a</text><text x="880" y="477.9" class="sans" font-size="17" font-weight="400" fill="#B8B8C2">rule changed in the last seven days, we say so, and we tell you to check</text><text x="880" y="503.4" class="sans" font-size="17" font-weight="400" fill="#B8B8C2">again before you fly. Prices quoted below were checked live at 9:41 and can</text><text x="880" y="528.9" class="sans" font-size="17" font-weight="400" fill="#B8B8C2">move until you book.</text>
<rect x="880" y="584.4" width="3" height="90" fill="#FF0049"/>
<text x="904" y="618.4" class="disp" font-size="30" font-weight="400" letter-spacing="-0.15" font-style="italic" fill="#FFFFFF">Volatile facts are fetched. Rules are cited. Nothing is left</text><text x="904" y="652.9" class="disp" font-size="30" font-weight="400" letter-spacing="-0.15" font-style="italic" fill="#FFFFFF">to memory.</text>
<text x="880" y="790" class="sans" font-size="11" font-weight="600" letter-spacing="0.88" fill="#85838F">PAIRING RULES</text>
<text x="880" y="824" class="sans" font-size="14" font-weight="600" letter-spacing="-0.07" fill="#FF0049">1</text>
<text x="908" y="824" class="sans" font-size="15" font-weight="400" fill="#B8B8C2">Serif for the hook, never for UI chrome, labels, or numbers.</text>
<text x="880" y="854" class="sans" font-size="14" font-weight="600" letter-spacing="-0.07" fill="#FF0049">2</text>
<text x="908" y="854" class="sans" font-size="15" font-weight="400" fill="#B8B8C2">One serif moment per screen. If the hero uses it, cards do not.</text>
<text x="880" y="884" class="sans" font-size="14" font-weight="600" letter-spacing="-0.07" fill="#FF0049">3</text>
<text x="908" y="884" class="sans" font-size="15" font-weight="400" fill="#B8B8C2">Numbers are Inter with tabular figures, so prices align and do not jitter.</text>
<text x="880" y="914" class="sans" font-size="14" font-weight="600" letter-spacing="-0.07" fill="#FF0049">4</text>
<text x="908" y="914" class="sans" font-size="15" font-weight="400" fill="#B8B8C2">Uppercase only for labels and kickers, tracked +8%.</text>
<text x="880" y="944" class="sans" font-size="14" font-weight="600" letter-spacing="-0.07" fill="#FF0049">5</text>
<text x="908" y="944" class="sans" font-size="15" font-weight="400" fill="#B8B8C2">On media: Inter Bold, two lines max, always over the bottom scrim.</text>
</svg>