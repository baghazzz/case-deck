<text x="120" y="236" class="disp" font-size="88" font-weight="400" letter-spacing="-0.44" fill="#FFFFFF">Red means now. Lavender means you.</text>
<text x="120" y="334" class="sans" font-size="24" font-weight="400" fill="#B8B8C2">#FF0049 and #DDBEF0 are observed brand hues. Everything else is</text><text x="120" y="367.6" class="sans" font-size="24" font-weight="400" fill="#B8B8C2">reconstructed around one idea: colour is a job, not a mood.</text>
