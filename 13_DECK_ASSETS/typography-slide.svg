<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="t d">
<title id="t">Typography</title>
<desc id="d">Two families · Wake, A Glance-inspired design system. Original vector artwork; not a Glance asset.</desc>
<defs><style>.sans{font-family:Inter, 'Helvetica Neue', Arial, sans-serif;}.disp{font-family:'Instrument Serif', 'Times New Roman', Georgia, serif;}.tnum{font-variant-numeric:tabular-nums;}</style></defs>
<rect id="background" width="1920" height="1080" fill="#0C0C10"/>
<text x="120" y="132" class="sans" font-size="16" font-weight="600" letter-spacing="1.28" fill="#FF0049">TYPOGRAPHY</text>
<text x="1800" y="1020" class="sans" font-size="16" font-weight="500" letter-spacing="0.16" text-anchor="end" fill="#85838F">05</text>
<text x="120" y="1020" class="sans" font-size="16" font-weight="500" letter-spacing="0.16" fill="#85838F">Wake · A Glance-inspired design system</text>
<text x="120" y="380" class="disp" font-size="260" font-weight="400" letter-spacing="-1.3" fill="#FFFFFF">Aa</text>
<text x="120" y="450" class="sans" font-size="24" font-weight="600" letter-spacing="-0.24" fill="#FFFFFF">Instrument Serif · the hook</text>
<text x="120" y="484" class="sans" font-size="18" font-weight="400" fill="#B8B8C2">Display 56 · 40. Once per screen. Editorial only.</text>
<text x="680" y="380" class="sans" font-size="260" font-weight="700" letter-spacing="-5.2" fill="#FFFFFF">Aa</text>
<text x="680" y="450" class="sans" font-size="24" font-weight="600" letter-spacing="-0.24" fill="#FFFFFF">Inter · everything read fast</text>
<text x="680" y="484" class="sans" font-size="18" font-weight="400" fill="#B8B8C2">700 headlines · 600 labels · 400 body · tabular prices</text>
<text x="120" y="620" class="disp" font-size="40" font-weight="400" letter-spacing="-0.2" fill="#FFFFFF">Pick what wakes you up</text>
<text x="1800" y="620" class="sans" font-size="16" font-weight="500" letter-spacing="0.16" text-anchor="end" fill="#85838F">display · 40/1.05</text>
<text x="120" y="688" class="sans" font-size="26" font-weight="700" letter-spacing="-0.52" fill="#FFFFFF">Monsoon's over. Six beaches worth the flight</text>
<text x="1800" y="688" class="sans" font-size="16" font-weight="500" letter-spacing="0.16" text-anchor="end" fill="#85838F">headline-media · 26/1.15</text>
<text x="120" y="747.8" class="sans" font-size="22" font-weight="700" letter-spacing="-0.33" fill="#FFFFFF">Because you saved Goa</text>
<text x="1800" y="747.8" class="sans" font-size="16" font-weight="500" letter-spacing="0.16" text-anchor="end" fill="#85838F">h2 · 22/1.2</text>
<text x="120" y="799.4" class="sans" font-size="15" font-weight="400" fill="#FFFFFF">Fares are checked live before you see them.</text>
<text x="1800" y="799.4" class="sans" font-size="16" font-weight="500" letter-spacing="0.16" text-anchor="end" fill="#85838F">body · 15/1.5</text>
<text x="120" y="845.9" class="sans tnum" font-size="12" font-weight="500" letter-spacing="0.12" fill="#FFFFFF">Wake Travel · 4 min · ₹5,842 · 9:41</text>
<text x="1800" y="845.9" class="sans" font-size="16" font-weight="500" letter-spacing="0.16" text-anchor="end" fill="#85838F">metadata · 12/1.3</text>
<text x="120" y="890.5" class="sans" font-size="11" font-weight="600" letter-spacing="0.88" fill="#FFFFFF">TRAVEL · FOR YOU</text>
<text x="1800" y="890.5" class="sans" font-size="16" font-weight="500" letter-spacing="0.16" text-anchor="end" fill="#85838F">label · 11/1.2</text>
<text x="1340" y="300" class="sans" font-size="14" font-weight="600" letter-spacing="1.12" fill="#85838F">PAIRING RULES</text>
<text x="1340" y="350" class="sans" font-size="22" font-weight="400" fill="#B8B8C2">1  One serif moment per screen</text>
<text x="1340" y="390" class="sans" font-size="22" font-weight="400" fill="#B8B8C2">2  Numbers always Inter, tabular</text>
<text x="1340" y="430" class="sans" font-size="22" font-weight="400" fill="#B8B8C2">3  Caps only for labels, +8% tracking</text>
<text x="1340" y="470" class="sans" font-size="22" font-weight="400" fill="#B8B8C2">4  Two lines max on media</text>
</svg>