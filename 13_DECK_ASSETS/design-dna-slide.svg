<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="t d">
<title id="t">Design DNA</title>
<desc id="d">Five traits that define the language · Wake, A Glance-inspired design system. Original vector artwork; not a Glance asset.</desc>
<defs><style>.sans{font-family:Inter, 'Helvetica Neue', Arial, sans-serif;}.disp{font-family:'Instrument Serif', 'Times New Roman', Georgia, serif;}.tnum{font-variant-numeric:tabular-nums;}</style></defs>
<rect id="background" width="1920" height="1080" fill="#0C0C10"/>
<text x="120" y="132" class="sans" font-size="16" font-weight="600" letter-spacing="1.28" fill="#FF0049">DESIGN DNA</text>
<text x="1800" y="1020" class="sans" font-size="16" font-weight="500" letter-spacing="0.16" text-anchor="end" fill="#85838F">02</text>
<text x="120" y="1020" class="sans" font-size="16" font-weight="500" letter-spacing="0.16" fill="#85838F">Wake · A Glance-inspired design system</text>
<text x="120" y="236" class="disp" font-size="88" font-weight="400" letter-spacing="-0.44" fill="#FFFFFF">Five traits, one language</text>
<text x="120" y="334" class="sans" font-size="24" font-weight="400" fill="#B8B8C2">What makes a Glance-like interface feel like itself, reduced to five rules</text><text x="120" y="367.6" class="sans" font-size="24" font-weight="400" fill="#B8B8C2">a team can check a screen against.</text>
<rect x="120" y="560" width="320" height="360" rx="24" fill="#16161B"/>
<circle cx="176" cy="624" r="32" fill="#3A0716"/>
<g transform="translate(160 608) scale(1.3333)" fill="none" stroke="#FF0049" stroke-width="1.312" stroke-linecap="round" stroke-linejoin="round" data-icon="live"><circle cx="12" cy="12" r="2.2" fill="#FF0049"/><path d="M8 8a5.7 5.7 0 0 0 0 8"/><path d="M16 8a5.7 5.7 0 0 1 0 8"/><path d="M5.2 5.2a9.6 9.6 0 0 0 0 13.6"/><path d="M18.8 5.2a9.6 9.6 0 0 1 0 13.6"/></g>
<text x="148" y="710" class="sans" font-size="16" font-weight="500" letter-spacing="0.16" fill="#85838F">01</text>
<text x="148" y="756" class="disp" font-size="36" font-weight="400" letter-spacing="-0.18" fill="#FFFFFF">Wake-first</text>
<text x="148" y="804.72" class="sans" font-size="18" font-weight="400" fill="#B8B8C2">Value in the two seconds after</text><text x="148" y="831.72" class="sans" font-size="18" font-weight="400" fill="#B8B8C2">the screen lights up.</text>
<rect x="464" y="560" width="320" height="360" rx="24" fill="#16161B"/>
<circle cx="520" cy="624" r="32" fill="#2A2A33"/>
<g transform="translate(504 608) scale(1.3333)" fill="none" stroke="#FFFFFF" stroke-width="1.312" stroke-linecap="round" stroke-linejoin="round" data-icon="entertainment"><path d="M6.5 4.5h11a3 3 0 0 1 3 3v9a3 3 0 0 1-3 3h-11a3 3 0 0 1-3-3v-9a3 3 0 0 1 3-3z"/><path d="M10.2 9.2v5.6l4.6-2.8z"/></g>
<text x="492" y="710" class="sans" font-size="16" font-weight="500" letter-spacing="0.16" fill="#85838F">02</text>
<text x="492" y="756" class="disp" font-size="36" font-weight="400" letter-spacing="-0.18" fill="#FFFFFF">Media is the layout</text>
<text x="492" y="804.72" class="sans" font-size="18" font-weight="400" fill="#B8B8C2">Imagery carries structure; text</text><text x="492" y="831.72" class="sans" font-size="18" font-weight="400" fill="#B8B8C2">rides on a scrim.</text>
<rect x="808" y="560" width="320" height="360" rx="24" fill="#16161B"/>
<circle cx="864" cy="624" r="32" fill="#2A2A33"/>
<g transform="translate(848 608) scale(1.3333)" fill="none" stroke="#FFFFFF" stroke-width="1.312" stroke-linecap="round" stroke-linejoin="round" data-icon="arrow"><path d="M7 17 17 7"/><path d="M8.5 7H17v8.5"/></g>
<text x="836" y="710" class="sans" font-size="16" font-weight="500" letter-spacing="0.16" fill="#85838F">03</text>
<text x="836" y="756" class="disp" font-size="36" font-weight="400" letter-spacing="-0.18" fill="#FFFFFF">One hook, one action</text>
<text x="836" y="804.72" class="sans" font-size="18" font-weight="400" fill="#B8B8C2">Each surface makes one</text><text x="836" y="831.72" class="sans" font-size="18" font-weight="400" fill="#B8B8C2">promise and offers one next</text><text x="836" y="858.72" class="sans" font-size="18" font-weight="400" fill="#B8B8C2">step.</text>
<rect x="1152" y="560" width="320" height="360" rx="24" fill="#16161B"/>
<circle cx="1208" cy="624" r="32" fill="#251A2E"/>
<g transform="translate(1192 608) scale(1.3333)" fill="none" stroke="#DDBEF0" stroke-width="1.312" stroke-linecap="round" stroke-linejoin="round" data-icon="personalization"><path d="M11 3.5c.6 4.3 2.2 5.9 6.5 6.5-4.3.6-5.9 2.2-6.5 6.5-.6-4.3-2.2-5.9-6.5-6.5 4.3-.6 5.9-2.2 6.5-6.5z"/><path d="M18.5 15.5c.2 1.3.7 1.8 2 2-1.3.2-1.8.7-2 2-.2-1.3-.7-1.8-2-2 1.3-.2 1.8-.7 2-2z"/></g>
<text x="1180" y="710" class="sans" font-size="16" font-weight="500" letter-spacing="0.16" fill="#85838F">04</text>
<text x="1180" y="756" class="disp" font-size="36" font-weight="400" letter-spacing="-0.18" fill="#FFFFFF">Red means now,</text><text x="1180" y="792.72" class="disp" font-size="36" font-weight="400" letter-spacing="-0.18" fill="#FFFFFF">lavender means you</text>
<text x="1180" y="841.44" class="sans" font-size="18" font-weight="400" fill="#B8B8C2">Signal for action and live; iris</text><text x="1180" y="868.44" class="sans" font-size="18" font-weight="400" fill="#B8B8C2">for anything personalised.</text>
<rect x="1496" y="560" width="320" height="360" rx="24" fill="#16161B"/>
<circle cx="1552" cy="624" r="32" fill="#2A2A33"/>
<g transform="translate(1536 608) scale(1.3333)" fill="none" stroke="#FFFFFF" stroke-width="1.312" stroke-linecap="round" stroke-linejoin="round" data-icon="shield-check"><path d="M12 3 19.5 6v5.5c0 4.6-3.2 8.2-7.5 9.5-4.3-1.3-7.5-4.9-7.5-9.5V6z"/><path d="M8.8 12.2l2.3 2.3 4.3-4.6"/></g>
<text x="1524" y="710" class="sans" font-size="16" font-weight="500" letter-spacing="0.16" fill="#85838F">05</text>
<text x="1524" y="756" class="disp" font-size="36" font-weight="400" letter-spacing="-0.18" fill="#FFFFFF">Show your sources</text>
<text x="1524" y="804.72" class="sans" font-size="18" font-weight="400" fill="#B8B8C2">Fresh, cited, controllable: trust</text><text x="1524" y="831.72" class="sans" font-size="18" font-weight="400" fill="#B8B8C2">you can see.</text>
</svg>