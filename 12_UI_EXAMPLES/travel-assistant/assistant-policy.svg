<title id="t">Travel assistant · cited policy</title>
<desc id="d">Travel assistant · cited policy: phone screen template built from Wake components · Wake, A Glance-inspired design system. Original vector artwork; not a Glance asset.</desc>
<defs><style>.sans{font-family:Inter, 'Helvetica Neue', Arial, sans-serif;}.disp{font-family:'Instrument Serif', 'Times New Roman', Georgia, serif;}.tnum{font-variant-numeric:tabular-nums;}</style><clipPath id="c92"><rect x="30" y="30" width="390" height="844" rx="54"/></clipPath></defs>
<g><rect x="20" y="20" width="410" height="864" rx="64" fill="#1B1B20" stroke="#2E2E36" stroke-width="1"/><g clip-path="url(#c92)"><rect x="30" y="30" width="390" height="844" fill="#000000"/><rect x="30" y="30" width="390" height="844" fill="#0C0C10"/><text x="58" y="60" class="sans tnum" font-size="15" font-weight="600" letter-spacing="-0.07" fill="#FFFFFF">9:41</text><rect x="365" y="50" width="25" height="12" rx="3.5" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.9"/><rect x="367" y="52" width="18" height="8" rx="2" fill="#FFFFFF"/><rect x="391.5" y="54" width="1.5" height="4" rx="1" fill="#FFFFFF" opacity="0.6"/><rect x="332" y="57.5" width="3" height="2.5" rx="1" fill="#FFFFFF"/><rect x="337" y="55" width="3" height="5" rx="1" fill="#FFFFFF"/><rect x="342" y="52.5" width="3" height="7.5" rx="1" fill="#FFFFFF"/><rect x="347" y="50" width="3" height="10" rx="1" fill="#FFFFFF"/><path d="M350 55 a8 8 0 0 1 11 0 M352.5 58 a4 4 0 0 1 6 0" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><g id="top-bar"><g><g transform="translate(52 96) scale(0.8333)" fill="none" stroke="#FFFFFF" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" data-icon="back"><path d="M19.5 12h-15"/><path d="M10.5 6l-6 6 6 6"/></g></g><text x="225" y="112" class="sans" font-size="17" font-weight="600" letter-spacing="-0.17" text-anchor="middle" fill="#FFFFFF">Ask</text><g><g transform="translate(374 96) scale(0.8333)" fill="none" stroke="#FFFFFF" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" data-icon="more"><circle cx="6" cy="12" r="1.6" fill="#FFFFFF"/><circle cx="12" cy="12" r="1.6" fill="#FFFFFF"/><circle cx="18" cy="12" r="1.6" fill="#FFFFFF"/></g></g></g><g id="bubble-user"><rect x="147.93" y="148" width="256.07" height="65" rx="20" fill="#FFFFFF"/><text x="163.93" y="175" class="sans" font-size="15" font-weight="400" fill="#0C0C10">Do I need a visa for Thailand on</text><text x="163.93" y="197.5" class="sans" font-size="15" font-weight="400" fill="#0C0C10">an Indian passport?</text></g><g id="policy-card"><rect x="46" y="229" width="358" height="250" rx="16" fill="#16161B" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/><g><rect x="62" y="245" width="120.77" height="22" rx="11.0" fill="#0F2E22"/><g transform="translate(69 249.5) scale(0.5417)" fill="none" stroke="#2FD08A" stroke-width="3.231" stroke-linecap="round" stroke-linejoin="round" data-icon="shield-check"><path d="M12 3 19.5 6v5.5c0 4.6-3.2 8.2-7.5 9.5-4.3-1.3-7.5-4.9-7.5-9.5V6z"/><path d="M8.8 12.2l2.3 2.3 4.3-4.6"/></g><text x="85" y="259.8" class="sans" font-size="10.5" font-weight="600" letter-spacing="0.84" fill="#2FD08A">CITED ANSWER</text></g><text x="62" y="295" class="sans" font-size="15" font-weight="400" fill="#FFFFFF">Indian passport holders can enter Thailand</text><text x="62" y="317.5" class="sans" font-size="15" font-weight="400" fill="#FFFFFF">visa-free for tourism for a limited stay. Check</text><text x="62" y="340" class="sans" font-size="15" font-weight="400" fill="#FFFFFF">the stay length and entry conditions on the</text><text x="62" y="362.5" class="sans" font-size="15" font-weight="400" fill="#FFFFFF">official page before you fly.</text><rect x="58" y="391" width="334" height="60" rx="12" fill="#2A2A33"/><rect x="58" y="391" width="3" height="60" rx="1.5" fill="#2FD08A"/><g transform="translate(72 409) scale(0.9167)" fill="none" stroke="#B8B8C2" stroke-width="1.909" stroke-linecap="round" stroke-linejoin="round" data-icon="passport"><path d="M7 3h10a1.5 1.5 0 0 1 1.5 1.5v15A1.5 1.5 0 0 1 17 21H7a1.5 1.5 0 0 1-1.5-1.5v-15A1.5 1.5 0 0 1 7 3z"/><path d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/><path d="M9.5 16.5h5"/></g><text x="104" y="417" class="sans" font-size="12" font-weight="600" fill="#FFFFFF">Royal Thai Embassy, New Delhi · Visa page</text><text x="104" y="435" class="sans tnum" font-size="12" font-weight="500" fill="#85838F">Last verified 29 Sep 2026</text><g transform="translate(362 410) scale(0.8333)" fill="none" stroke="#B8B8C2" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" data-icon="external"><path d="M13.5 4.5h6v6"/><path d="M19.5 4.5l-8 8"/><path d="M17.5 13.5v5a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1v-11a1 1 0 0 1 1-1h5"/></g></g><g id="bubble-user"><rect x="182.69" y="499" width="221.31" height="65" rx="20" fill="#FFFFFF"/><text x="198.69" y="526" class="sans" font-size="15" font-weight="400" fill="#0C0C10">And for a 10-hour transit in</text><text x="198.69" y="548.5" class="sans" font-size="15" font-weight="400" fill="#0C0C10">Kuala Lumpur?</text></g><g id="deflect-card"><rect x="46" y="580" width="358" height="265" rx="16" fill="#16161B" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/><g transform="translate(62 598) scale(0.8333)" fill="none" stroke="#5AA9FF" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" data-icon="info"><path d="M20.5 12a8.5 8.5 0 1 1-17 0 8.5 8.5 0 0 1 17 0z"/><path d="M12 11v5.5"/><circle cx="12" cy="7.9" r="1.6" fill="#5AA9FF"/></g><text x="92" y="613" class="sans" font-size="17" font-weight="600" letter-spacing="-0.17" fill="#FFFFFF">I can't confirm this one from an</text><text x="92" y="635" class="sans" font-size="17" font-weight="600" letter-spacing="-0.17" fill="#FFFFFF">official source</text><text x="62" y="670" class="sans" font-size="13" font-weight="400" fill="#B8B8C2">Transit rules for this route changed recently. Rather</text><text x="62" y="689" class="sans" font-size="13" font-weight="400" fill="#B8B8C2">than guess, here's the official page, or talk to a travel</text><text x="62" y="708" class="sans" font-size="13" font-weight="400" fill="#B8B8C2">expert.</text><g><rect x="62" y="735" width="326" height="44" rx="22.0" fill="#FFFFFF"/><text x="147.5" y="762.4" class="sans" font-size="15" font-weight="600" letter-spacing="-0.07" fill="#0C0C10">Open official page</text><g transform="translate(284.5 748) scale(0.75)" fill="none" stroke="#0C0C10" stroke-width="2.333" stroke-linecap="round" stroke-linejoin="round" data-icon="external"><path d="M13.5 4.5h6v6"/><path d="M19.5 4.5l-8 8"/><path d="M17.5 13.5v5a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1v-11a1 1 0 0 1 1-1h5"/></g></g><g><rect x="62" y="787" width="326" height="44" rx="22.0" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/><g transform="translate(152.53 800) scale(0.75)" fill="none" stroke="#FFFFFF" stroke-width="2.333" stroke-linecap="round" stroke-linejoin="round" data-icon="chat"><path d="M4.5 6.5a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-6.5l-4.5 3.5v-3.5h0a2 2 0 0 1-2-2z"/></g><text x="178.53" y="814.4" class="sans" font-size="15" font-weight="600" letter-spacing="-0.07" fill="#FFFFFF">Talk to an expert</text></g></g><rect x="158" y="861" width="134" height="5" rx="3" fill="#FFFFFF"/></g><rect x="163" y="41" width="124" height="36" rx="18" fill="#000000"/></g>
